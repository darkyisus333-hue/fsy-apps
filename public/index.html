function comites(){return S.teams.map(t=>`<div class="card tb ${t.id}"><h3 style="margin:0">${esc(t.name)}</h3><p class="m">Cada comité se puede asignar a cualquier actividad.</p>${t.com.map(c=>{const n=now(),nx=all().find(x=>x.st>n&&x.com.includes(c.id)),k=all().filter(x=>x.com.includes(c.id)).length;return`<div class="cr"><input class="cin" data-c="${c.id}" data-f="name" value="${esc(c.name)}" aria-label="Comité"><input class="cin" data-c="${c.id}" data-f="resp" value="${esc(c.resp)}" placeholder="Responsable" aria-label="Responsable"><span class="m">${k} act.</span><button class="dg" data-delc="${c.id}">Quitar</button>${nx?`<span class="m" style="grid-column:1/-1">Próxima: ${esc(nx.act)} · <span class="pill" data-p="${nx.id}"></span></span>`:''}</div>`}).join('')}<div class="cr"><input id="nn-${t.id}" placeholder="Nuevo comité"><input id="nr-${t.id}" placeholder="Responsable"><button class="pri" data-addc="${t.id}">Agregar</button></div></div>`).join('')}
function materiales(){let tot=0,ok=0,h='';for(const d of S.days){const b=d.items.filter(i=>i.mats.length).map(i=>`<div class="sec">${hm(i.s)} · ${esc(i.act)}</div>${chips(i.com)}${i.mats.map((m,k)=>{tot++;ok+=m.ok?1:0;return`<label class="ck"><input type="checkbox" data-mk="${i.id}|${k}" ${m.ok?'checked':''}>${esc(m.q)} × ${esc(m.n)}${m.note?` <span class="m">(${esc(m.note)})</span>`:''}</label><br>`}).join('')}`).join('');if(b)h+=`<div class="card"><h3 style="margin:0">${d.label} · ${d.wd} ${d.date.slice(8)} dic</h3>${b}</div>`}
return`<div class="card"><h3 style="margin:0">${ok} de ${tot} materiales listos</h3><p class="m">Marca cada material cuando esté comprado o confirmado. Para agregar o cambiar materiales, edita la actividad en Agenda.</p></div>${h}<div class="bar"><button class="dg" id="reset">Restaurar horario original</button></div>`}
const equipos=()=>`<div class="seg"><button data-sub="co" class="${sub=='co'?'on':''}">Comités</button><button data-sub="ma" class="${sub=='ma'?'on':''}">Materiales</button></div>${sub=='co'?comites():materiales()}`;
function render(){$('#tabs').innerHTML=[['in','Inicio','home'],['ag','Agenda','cal'],['eq','Equipos','users']].map(([k,l,i])=>`<button data-tab="${k}" class="${tab==k?'on':''}">${ic(i)}${l}</button>`).join('');
$('#main').innerHTML=tab=='in'?home():tab=='ag'?agenda():equipos();tick()}
function tick(){if(tab=='in')hero();const mn=Math.floor(now()/6e4);if(tab=='ag'&&mn!=lastMin&&lastMin&&!$('#dlg').open&&!document.querySelector('.mb[open]')){lastMin=mn;render();return}lastMin=mn;document.querySelectorAll('#main [data-p]').forEach(e=>{const x=all().find(y=>y.id==e.dataset.p);if(!x)return;const p=pill(x);e.textContent=p[0];e.classList.toggle('now',!!p[1])})}
function edit(id){let d,i,nw=0;if(id){[d,i]=loc(id)}else{d=S.days[day];i={id:'n'+Date.now(),s:480,e:540,act:'',enc:'',lug:'',nec:'',com:[],mats:[]};nw=1}
$('#dlg').innerHTML=`<form id="ef" data-id="${i.id}" data-new="${nw}"><h2 style="margin:0;font-size:17px">${nw?'Nueva actividad':'Editar actividad'} · ${d.label}</h2>
<label>Actividad</label><input name="act" required value="${esc(i.act)}"><div class="g2"><div><label>Inicio</label><input type="time" name="s" required value="${hh(i.s)}"></div><div><label>Fin</label><input type="time" name="e" required value="${hh(i.e)}"></div></div>
<div class="g2"><div><label>Lugar</label><input name="lug" value="${esc(i.lug)}"></div><div><label>Encargado</label><input name="enc" value="${esc(i.enc)}"></div></div>
<label>Necesidades</label><textarea name="nec" rows="2">${esc(i.nec)}</textarea>
<label>Comités a cargo</label>${S.teams.map(t=>`<div class="m"><b>${esc(t.name)}</b></div>${t.com.map(c=>`<label class="ck"><input type="checkbox" name="com" value="${c.id}" ${i.com.includes(c.id)?'checked':''}>${esc(c.name)}</label>`).join('')}`).join('')}
<label>Materiales (una línea cada uno: cantidad | material | nota)</label><textarea name="mats" rows="5">${esc(i.mats.map(m=>`${m.q} | ${m.n} | ${m.note||''}`).join('\n'))}</textarea>
<label>Mover las actividades siguientes de este día (minutos, + o −)</label><input type="number" name="sh" value="0" step="5">
<div class="bar"><button class="pri" type="submit">Guardar cambios</button><button type="button" id="cx">Cancelar</button>${nw?'':'<button type="button" class="dg" id="del">Eliminar</button>'}</div></form>`;$('#dlg').showModal()}
const tm=v=>{const[a,b]=v.split(':');return+a*60+ +b};
document.addEventListener('submit',e=>{if(e.target.id!='ef')return;e.preventDefault();const f=e.target,fd=new FormData(f),id=f.dataset.id;let d,i;
if(f.dataset.new=='1'){d=S.days[day];i={id,com:[],mats:[]};d.items.push(i)}else[d,i]=loc(id);
const os=i.s;i.act=fd.get('act');i.s=tm(fd.get('s'));i.e=tm(fd.get('e'));if(i.e<=i.s)i.e=i.s+15;i.lug=fd.get('lug');i.enc=fd.get('enc');i.nec=fd.get('nec');i.com=fd.getAll('com');
const old=i.mats||[];i.mats=fd.get('mats').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split('|').map(x=>x.trim()),n=p[1]??p[0],o=old.find(m=>m.n==n);return{n,q:p[1]!==undefined?p[0]:'1',note:p[2]||'',ca:o?.ca||'',ok:!!o?.ok}});
const sh=+fd.get('sh')||0;if(sh)d.items.forEach(x=>{if(x!==i&&x.s>=os){x.s+=sh;x.e+=sh}});save();$('#dlg').close();render()});
document.addEventListener('click',e=>{const t=e.target.closest('button,input[data-mk]');if(!t)return;const q=k=>t.dataset[k];
if(q('tab')){tab=q('tab');render();window.scrollTo(0,0)}else if(q('sub')){sub=q('sub');render()}else if(q('day')){day=+q('day');render()}else if(q('edit'))edit(q('edit'));else if(q('new'))edit();
else if(t.id=='cx')$('#dlg').close();else if(t.id=='del'){const[d]=loc(t.form.dataset.id);d.items=d.items.filter(x=>x.id!=t.form.dataset.id);save();$('#dlg').close();render()}
else if(q('mk')){const[a,b]=q('mk').split('|'),[,i]=loc(a);i.mats[b].ok=t.checked;save();render()}
else if(q('addc')){const n=$('#nn-'+q('addc')).value.trim();if(n){S.teams.find(x=>x.id==q('addc')).com.push({id:'c'+Date.now(),name:n,resp:$('#nr-'+q('addc')).value.trim()});save();render()}}
else if(q('delc')){if(confirm('¿Quitar este comité? Se desasigna de todas las actividades.')){S.teams.forEach(x=>x.com=x.com.filter(c=>c.id!=q('delc')));S.days.forEach(d=>d.items.forEach(i=>i.com=i.com.filter(c=>c!=q('delc'))));save();render()}}
else if(t.id=='reset'){if(confirm('Se perderán todos los cambios y se restaurará para todos. ¿Continuar?')){S=JSON.parse(JSON.stringify(D));save();render()}}
else if(t.id=='simx'){simv='';render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='filt'){filt=t.value;render()}else if(t.id=='sim'){simv=t.value;render()}else if(t.classList.contains('cin')){S.teams.forEach(x=>x.com.forEach(k=>{if(k.id==t.dataset.c)k[t.dataset.f]=t.value}));save()}});
{const n=now(),a=all(),c=a.find(x=>n>=x.st&&n<x.en)||a.find(x=>x.st>n);if(c)day=c.d.id}
$('#dlg').addEventListener('close',()=>{if(pend){pend=0;render()}});let U=null,uname='',DP=null;
const gate=h=>{G.innerHTML=`<div class="gi"><img src="logo.png" alt=""><h2>FSY Occidente · Logística</h2>${h}</div>`;G.hidden=false};const G=$('#gate');
const standalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;if(tab=='in')render()});
addEventListener('appinstalled',()=>{DP=null;render()});
function setup(){let h='';const bx=(a,b,c)=>`<div class="card" style="margin-top:0;margin-bottom:12px"><h3 style="margin:0;font-size:15px">${a}</h3><p class="m">${b}</p>${c||''}</div>`;
if(!standalone()){if(DP)h+=bx('Instalar app en tu dispositivo','Ábrela como app, sin barra del navegador y con avisos.','<button class="pri" data-act="install">Instalar app</button>');else if(ios)h+=bx('Instalar app en tu iPhone','Toca Compartir y luego “Agregar a pantalla de inicio”. Los avisos funcionan desde la app instalada.')}
if('Notification' in window&&Notification.permission=='default'&&(standalone()||!ios))h+=bx('Avisos de próxima actividad','Recibe una notificación unos minutos antes de cada actividad.','<button class="pri" data-act="notif">Activar avisos</button>');return h}
async function getTok(reg){if(!firebase.messaging.isSupported())return;const m=firebase.messaging();const tok=await m.getToken({vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});if(tok&&auth.currentUser)await db.doc('tokens/'+tok).set({uid:auth.currentUser.uid,ts:Date.now()});if(!window.fm){window.fm=1;m.onMessage(p=>{const d=p.data||{};reg.showNotification(d.title||'FSY',{body:d.body||'',icon:'icon-192.png',tag:d.tag})})}}
const showEnter=()=>gate(`<p>Bienvenido de nuevo, <b>${esc(uname)}</b></p><p class="m">${CANW?'Acceso para editar':'Acceso de solo lectura'}</p><button class="pri" data-act="enter">Entrar al panel</button><br><button data-act="out" style="margin-top:8px;padding:8px 18px;font-size:14px">Cerrar sesión</button>`);
const showLogin=m=>gate(`${m||''}<p class="m">Inicia sesión con tu cuenta de Google para entrar al panel.</p><button class="pri" data-act="login">Iniciar sesión con Google</button>`);
gate('<p class="m">Cargando…</p>');
auth.onAuthStateChanged(async u=>{if(!u){stopSync();U=null;CANW=false;showLogin();return}
gate('<p class="m">Verificando tu acceso…</p>');
try{const a=(await db.doc('config/acceso').get()).data(),em=(u.email||'').toLowerCase(),L=k=>(a[k]||[]).map(x=>String(x).toLowerCase()),ed=L('editores').includes(em);if(!ed&&!L('lectores').includes(em))throw 0;
U=u;CANW=ed;uname=u.displayName||em;document.body.classList.toggle('ro',!ed);
$('#hi').textContent='Hola, '+uname.split(' ')[0]+' · '+(ed?'Puede editar':'Solo lectura');$('#av').innerHTML=u.photoURL?`<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">`:esc(uname[0]||'?').toUpperCase();
startSync();let k='';try{k=localStorage.getItem('fsyin')}catch(x){}if(k==u.uid)G.hidden=true;else showEnter();
if('Notification' in window&&Notification.permission=='granted'&&'serviceWorker' in navigator)navigator.serviceWorker.ready.then(getTok).catch(()=>{});render()}
catch(x){gate(`<p class="m">La cuenta ${esc(u.email)} no tiene acceso. Pide al coordinador que la agregue.</p><button data-act="out">Cerrar sesión</button>`)}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act],#av');if(!t)return;const a=t.dataset.act;
if(a=='login'){const p=new firebase.auth.GoogleAuthProvider();try{await auth.signInWithPopup(p)}catch(x){if(x.code!='auth/popup-closed-by-user')auth.signInWithRedirect(p)}}
else if(a=='out'){try{localStorage.removeItem('fsyin')}catch(x){}auth.signOut()}
else if(a=='enter'){try{localStorage.setItem('fsyin',U.uid)}catch(x){}G.hidden=true}
else if(a=='install'&&DP){DP.prompt();await DP.userChoice;DP=null;render()}
else if(a=='notif'){try{if(await Notification.requestPermission()=='granted')await getTok(await navigator.serviceWorker.ready)}catch(x){}render()}
else if(t.id=='av'&&U){try{localStorage.removeItem('fsyin')}catch(x){}showEnter()}});
if(fix())save();render();setInterval(tick,1000);
